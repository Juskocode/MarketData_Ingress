name: TensorRT GPU Validation

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: Fixed-shape FP32 model path; a native identity engine is generated when absent
        required: true
        default: models/model.engine
      input_size:
        description: FP32 elements per sample
        required: true
        default: "512"
      target_us:
        description: Device-compute p99 target in microseconds
        required: true
        default: "1.0"
      use_cuda_graph:
        description: Capture TensorRT execution as a CUDA graph
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gpu-benchmark:
    runs-on: [self-hosted, linux, x64, gpu, tensorrt]
    steps:
      - uses: actions/checkout@v7
      - name: Configure with required TensorRT
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMD_REQUIRE_TENSORRT=ON
          -DMD_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run deterministic tests first
        run: ctest --test-dir build --output-on-failure
      - name: Generate a native test engine when no model was supplied
        id: model
        env:
          MODEL_PATH: ${{ inputs.model_path }}
          INPUT_SIZE: ${{ inputs.input_size }}
        run: |
          if [[ ! -f "${MODEL_PATH}" ]]; then
            ./build/bin/marketdata_build_engine \
              --output "${MODEL_PATH}" \
              --input-size "${INPUT_SIZE}"
            echo "verify_identity=true" >> "${GITHUB_OUTPUT}"
          else
            echo "verify_identity=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Enforce GPU device-latency SLO
        env:
          MODEL_PATH: ${{ inputs.model_path }}
          INPUT_SIZE: ${{ inputs.input_size }}
          TARGET_US: ${{ inputs.target_us }}
          VERIFY_IDENTITY: ${{ steps.model.outputs.verify_identity }}
          USE_CUDA_GRAPH: ${{ inputs.use_cuda_graph }}
        run: |
          VERIFY_ARGS=()
          if [[ "${VERIFY_IDENTITY}" == "true" ]]; then
            VERIFY_ARGS+=(--verify-identity)
          fi
          GRAPH_ARGS=()
          if [[ "${USE_CUDA_GRAPH}" == "true" ]]; then
            GRAPH_ARGS+=(--cuda-graph)
          fi
          ./build/bin/marketdata_ingress \
            --backend tensorrt \
            --model "${MODEL_PATH}" \
            --input-size "${INPUT_SIZE}" \
            --iterations 2000 \
            --warmup 200 \
            --target-scope device \
            --target-us "${TARGET_US}" \
            "${VERIFY_ARGS[@]}" \
            "${GRAPH_ARGS[@]}" \
            --json-out build/tensorrt_metrics.json
      - name: Upload GPU evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tensorrt-gpu-metrics
          path: build/tensorrt_metrics.json
          if-no-files-found: warn
