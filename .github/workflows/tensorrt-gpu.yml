name: TensorRT GPU Validation

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: Fixed-shape FP32 model path; a native identity engine is generated when absent
        required: true
        default: models/model.engine
      input_size:
        description: FP32 elements per sample
        required: true
        default: "512"
      target_us:
        description: Device-compute p99 target in microseconds
        required: true
        default: "1.0"
      use_cuda_graph:
        description: Capture TensorRT execution as a CUDA graph
        required: true
        type: boolean
        default: true
      historical_replay:
        description: Compare direct and CUDA Graph execution on both pinned historical datasets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gpu-benchmark:
    runs-on: [self-hosted, linux, x64, gpu, tensorrt]
    steps:
      - uses: actions/checkout@v7
      - name: Configure with required TensorRT
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMD_REQUIRE_TENSORRT=ON
          -DMD_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run deterministic tests first
        run: ctest --test-dir build --output-on-failure
      - name: Compare TensorRT replay modes on historical data
        if: inputs.historical_replay
        run: |
          mkdir -p out
          nvidia-smi --query-gpu=index,name,driver_version,memory.total --format=csv > out/nvidia.txt
          nvcc --version >> out/nvidia.txt
          python3 -m venv build-lake-venv
          build-lake-venv/bin/python -m pip install -r tools/lake/requirements.txt
          build-lake-venv/bin/python tools/lake/replay_public_history.py \
            --ingress build/bin/marketdata_ingress --output out/public-history
          build-lake-venv/bin/python tools/lake/compare_tensorrt_history.py \
            --history out/public-history --ingress build/bin/marketdata_ingress \
            --output out/tensorrt-history
      - name: Upload historical TensorRT evidence
        if: always() && inputs.historical_replay
        uses: actions/upload-artifact@v7
        with:
          name: tensorrt-historical-replay
          path: |
            out/nvidia.txt
            out/tensorrt-history/report.json
            out/tensorrt-history/*/*.json
          if-no-files-found: warn
      - name: Generate a native test engine when no model was supplied
        if: ${{ !inputs.historical_replay }}
        id: model
        env:
          MODEL_PATH: ${{ inputs.model_path }}
          INPUT_SIZE: ${{ inputs.input_size }}
        run: |
          if [[ ! -f "${MODEL_PATH}" ]]; then
            ./build/bin/marketdata_build_engine \
              --output "${MODEL_PATH}" \
              --input-size "${INPUT_SIZE}"
            echo "verify_identity=true" >> "${GITHUB_OUTPUT}"
          else
            echo "verify_identity=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Enforce GPU device-latency SLO
        if: ${{ !inputs.historical_replay }}
        env:
          MODEL_PATH: ${{ inputs.model_path }}
          INPUT_SIZE: ${{ inputs.input_size }}
          TARGET_US: ${{ inputs.target_us }}
          VERIFY_IDENTITY: ${{ steps.model.outputs.verify_identity }}
          USE_CUDA_GRAPH: ${{ inputs.use_cuda_graph }}
        run: |
          VERIFY_ARGS=()
          if [[ "${VERIFY_IDENTITY}" == "true" ]]; then
            VERIFY_ARGS+=(--verify-identity)
          fi
          GRAPH_ARGS=()
          if [[ "${USE_CUDA_GRAPH}" == "true" ]]; then
            GRAPH_ARGS+=(--cuda-graph)
          fi
          ./build/bin/marketdata_ingress \
            --backend tensorrt \
            --model "${MODEL_PATH}" \
            --input-size "${INPUT_SIZE}" \
            --iterations 2000 \
            --warmup 200 \
            --target-scope device \
            --target-us "${TARGET_US}" \
            "${VERIFY_ARGS[@]}" \
            "${GRAPH_ARGS[@]}" \
            --json-out build/tensorrt_metrics.json
      - name: Upload GPU evidence
        if: always() && !inputs.historical_replay
        uses: actions/upload-artifact@v7
        with:
          name: tensorrt-gpu-metrics
          path: build/tensorrt_metrics.json
          if-no-files-found: warn
      - name: Package validated GPU binaries
        if: success() && !inputs.historical_replay
        run: cmake --build build --target package
      - name: Upload validated GPU package
        if: success() && !inputs.historical_replay
        uses: actions/upload-artifact@v7
        with:
          name: tensorrt-gpu-package
          path: build/marketdata-ingress-*.tar.gz
          if-no-files-found: error
