name: MarketData Edge CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            cc: gcc
            cxx: g++
            build_type: Release
            sanitizers: OFF
            deployability: true
          - name: GCC Debug + sanitizers
            cc: gcc
            cxx: g++
            build_type: Debug
            sanitizers: ON
            deployability: false
          - name: Clang Release
            cc: clang
            cxx: clang++
            build_type: Release
            sanitizers: OFF
            deployability: false
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ clang
      - name: Configure deterministic mock build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMD_WITH_TENSORRT=OFF
          -DMD_BUILD_TESTS=ON
          -DMD_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run CTest suite
        run: ctest --test-dir build --output-on-failure
      - name: Run deployability contract
        if: matrix.deployability
        run: ./scripts/deployability.sh build
      - name: Run PR stress and policy checks
        if: github.event_name == 'pull_request' && matrix.deployability
        run: ./scripts/ci_pr_checks.sh build
      - name: Upload benchmark evidence
        if: always() && matrix.deployability
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-evidence
          path: build/marketdata_metrics_*.json
          if-no-files-found: warn

  source-policy:
    name: Source and shell policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Enforce no Python on the native hot path
        run: >-
          ! grep -R --line-number --include='*.cpp' --include='*.h'
          -E 'Python\.h|pybind11|PyObject' src include
