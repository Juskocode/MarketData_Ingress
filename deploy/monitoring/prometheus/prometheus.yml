global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s
  external_labels:
    stack: marketdata-edge

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: marketdata_edge
    static_configs:
      - targets:
          - host.docker.internal:9108
        labels:
          environment: local

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: victoriametrics
    static_configs:
      - targets:
          - victoriametrics:8428

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

remote_write:
  - name: victoriametrics
    url: http://victoriametrics:8428/api/v1/write
    remote_timeout: 10s
    queue_config:
      capacity: 5000
      min_shards: 1
      max_shards: 4
      max_samples_per_send: 1000
      batch_send_deadline: 2s
